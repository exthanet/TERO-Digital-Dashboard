services:
  dashboard:
    build: .
    image: tero-digital-dashboard:${IMAGE_TAG:-latest}
    ports:
      - "${HOST_PORT:-8080}:8080"
    # Values come from .env. Only these two are passed; other secrets stay out.
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
    restart: unless-stopped
