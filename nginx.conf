server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/csv;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Hashed build assets never change for a given file name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /runtime-config.js {
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback, equivalent to the "**" rewrite in firebase.json.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
