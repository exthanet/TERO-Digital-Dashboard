name: Data sync (Metricool + YouTube)

# Daily 05:17 Bangkok (off the hour: GitHub delays on-the-hour schedules).
# Admins can also start it from the dashboard's
# "สถานะการ Sync" → "รันตอนนี้" (Actions → Run workflow).
on:
  schedule:
    - cron: "17 22 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "write = update Firestore · test-run = check only · test-email = send a test email · test-alert = send a test Telegram message"
        type: choice
        options: [write, test-run, test-email, test-alert]
        default: write
      since:
        description: "First day to fetch (YYYY-MM-DD). Blank = last 90 days"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # A normal run takes 15–30 min; each step's time is on the run report (syncRuns → timings).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Node 24 runs the .ts sources directly; npm packages are needed only
      # for reading the TV rating workbook (xlsx).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Sync
        if: (inputs.mode || 'write') != 'test-alert'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          METRICOOL_API_TOKEN: ${{ secrets.METRICOOL_API_TOKEN }}
          METRICOOL_USER_ID: ${{ secrets.METRICOOL_USER_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YT_OAUTH_CLIENT_ID: ${{ secrets.YT_OAUTH_CLIENT_ID }}
          YT_OAUTH_CLIENT_SECRET: ${{ secrets.YT_OAUTH_CLIENT_SECRET }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN }}
          MODE: ${{ inputs.mode || 'write' }}
          SINCE: ${{ inputs.since }}
        run: |
          if [ -z "$SINCE" ]; then SINCE=$(date -u -d "90 days ago" +%F); fi
          if [ "$MODE" = "test-email" ]; then
            node scripts/metricool-sync.mjs --notify-test
          elif [ "$MODE" = "write" ]; then
            node scripts/metricool-sync.mjs --since="$SINCE" --write
          else
            node scripts/metricool-sync.mjs --since="$SINCE" --baseline=firestore
          fi

      # Every run to Telegram: ✅ summary on success, ⚠️ on a failure, a blocked
      # run or the time limit. Skipped when the secrets are not set.
      - name: Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          JOB_STATUS: ${{ job.status }}
          MODE: ${{ inputs.mode || 'write' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$MODE" = "test-alert" ]; then node scripts/notify-telegram.mjs --test
          elif [ "$MODE" != "test-email" ]; then node scripts/notify-telegram.mjs --sync
          fi

      # Backups to files run apart from the sync: scripts/backup-local.mjs on the
      # office PC every day, and backup.yml on GitHub (private repo only).

      - name: Alert Discord
        # cancelled() = stopped at the time limit; data may or may not be written (see syncRuns).
        if: failure() || cancelled()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$DISCORD_WEBHOOK_URL" ] && exit 0
          curl -sS -H "content-type: application/json" \
            -d "{\"content\":\"⚠️ Data sync ไม่สำเร็จ (ล้มเหลว หรือไม่ผ่านการตรวจ จึงไม่ได้เขียนข้อมูล) — ${RUN_URL}\"}" \
            "$DISCORD_WEBHOOK_URL"
